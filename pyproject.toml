[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-load-ml"
version = "1.0.0"
description = "Freight Load Machine Learning Platform"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Framework :: Streamlit",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "joblib==1.6.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "seaborn==0.13.2",
    "xgboost==3.4.1",
    "shap==0.53.0",
    "lightgbm==4.7.0",
    "streamlit==1.66.1",
    "openpyxl==3.1.5"
]

[tool.setuptools.packages.find]
include = ["src*", "app*", "data*"]